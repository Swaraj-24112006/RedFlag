[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
    "RUF012",  # Mutable class attributes in Django models and Meta
    "E501",    # Line too long
]

[tool.ruff.lint.per-file-ignores]
"config/settings/*" = ["F403", "F405"]
"**/migrations/*" = ["E501"]
